name: ci

# TODO(ci): automatic runs are off to save github.com Actions minutes (2026-11-09).
# To turn them back on, replace the `on:` block with:
#   on:
#     push:
#       branches: [main]
#     pull_request:
# Until then, run the local checks in AGENTS.md before pushing; a manual run is
# still possible from the Actions tab (Run workflow).
on:
  workflow_dispatch:

jobs:
  vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies yet; enable when Phase 7 adds go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q
