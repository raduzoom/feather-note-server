# Feather Cloud stack: the server, Postgres and S3-compatible storage. docs/self-hosting.md explains the setup.
# Postgres is deliberately not published to the host: 5432 stays inside Docker.
# S3-compatible storage is SeaweedFS (MinIO no longer publishes images):
# S3 API on host port 8421, filer web UI on 8422. Every published port is bound to 127.0.0.1: the filer UI has no
# login, and only a reverse proxy on this machine should reach the server.
name: feather

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feather-dev}
      POSTGRES_DB: ${POSTGRES_DB:-feather}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.30
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-feather}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-feather-dev-secret}
      # Storage holds 1 GB volumes, at most this many (so about this many GB).
      # SeaweedFS's default of 8 volumes filled up after one bucket.
      SEAWEED_VOLUME_MAX: ${SEAWEED_VOLUME_MAX:-100}
    # Writes the S3 identity file from the env vars above, then starts
    # master, volume, filer and S3 gateway in one process.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"feather","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max="$$SEAWEED_VOLUME_MAX"
    ports:
      - "127.0.0.1:8421:8333"
      - "127.0.0.1:8422:8888"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      args:
        VERSION: ${FEATHER_VERSION:-dev}
    environment:
      FEATHER_DATABASE_URL: postgres://${POSTGRES_USER:-feather}:${POSTGRES_PASSWORD:-feather-dev}@postgres:5432/${POSTGRES_DB:-feather}?sslmode=disable
      FEATHER_S3_ENDPOINT: http://s3:8333
      FEATHER_S3_BUCKET: ${FEATHER_S3_BUCKET:-feather}
      FEATHER_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-feather}
      FEATHER_S3_SECRET_KEY: ${S3_SECRET_KEY:-feather-dev-secret}
      # required; generate with: openssl rand -hex 32
      FEATHER_SERVER_SECRET: ${FEATHER_SERVER_SECRET:?set FEATHER_SERVER_SECRET in deploy/.env (openssl rand -hex 32)}
      FEATHER_BILLING: ${FEATHER_BILLING:-off}
      FEATHER_QUOTA_BYTES: ${FEATHER_QUOTA_BYTES:-10737418240}
      FEATHER_MAX_BLOB_BYTES: ${FEATHER_MAX_BLOB_BYTES:-104857600}
      FEATHER_TRUST_PROXY: ${FEATHER_TRUST_PROXY:-false}
      FEATHER_ALLOWED_ORIGINS: ${FEATHER_ALLOWED_ORIGINS:-}
      FEATHER_MAIL: ${FEATHER_MAIL:-log}
      FEATHER_SMTP_HOST: ${FEATHER_SMTP_HOST:-}
      FEATHER_SMTP_PORT: ${FEATHER_SMTP_PORT:-587}
      FEATHER_SMTP_USERNAME: ${FEATHER_SMTP_USERNAME:-}
      FEATHER_SMTP_PASSWORD: ${FEATHER_SMTP_PASSWORD:-}
      FEATHER_SMTP_FROM: ${FEATHER_SMTP_FROM:-}
    ports:
      - "127.0.0.1:8420:8420"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/feather-server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
